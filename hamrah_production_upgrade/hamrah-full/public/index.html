<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>همراه | پیام‌رسان</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" class="auth"><div class="auth-card"><div class="logo">✉</div><h1>همراه</h1><p>پیام‌رسانی ساده، سریع و امن</p><section id="phone-step"><label>شماره موبایل</label><input id="phone" placeholder="+98912xxxxxxx" dir="ltr"><button id="request">دریافت کد تأیید</button></section><section id="code-step" hidden><label>کد تأیید پیامک‌شده</label><input id="code" inputmode="numeric" maxlength="6" placeholder="••••••" dir="ltr"><button id="verify">ورود به همراه</button><small id="devcode"></small><a href="#" id="changephone">تغییر شماره</a></section><div id="auth-error"></div></div></div>
<div id="app" class="app" hidden><aside class="sidebar"><header><div class="logo small">✉</div><b>همراه</b><button id="newchat" title="گفتگوی جدید">＋</button><button id="settings">⚙</button></header><input id="filter" placeholder="جستجو در گفتگوها"><nav><button class="selected" data-filter="all">همه</button><button data-filter="group">گروه‌ها</button><button data-filter="channel">کانال‌ها</button></nav><div id="conversations"></div><footer id="me"></footer></aside><main><div id="welcome"><div>💬</div><h2>به همراه خوش آمدید</h2><p>برای شروع، یک گفتگو انتخاب کنید.</p></div><section id="room" hidden><header class="room-head"><button id="back">›</button><div><b id="room-title"></b><small id="room-sub"></small></div><span class="spacer"></span><button id="audio-call" title="تماس صوتی">☎</button><button id="video-call" title="تماس تصویری">▣</button><button id="room-menu">⋮</button></header><div id="messages"></div><div id="replying" hidden></div><div class="composer"><label class="attach">＋<input id="file" type="file"></label><button id="gif">GIF</button><input id="text" placeholder="پیام خود را بنویسید..."><button id="send">➤</button></div></section></main></div>
<div id="dialog" class="overlay" hidden><div class="dialog"><button class="x" id="close-dialog">×</button><div id="dialog-content"></div></div></div><div id="callbox" class="callbox" hidden><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video><div><b id="call-label">تماس</b><button id="hangup">پایان تماس</button></div></div><div id="toast"></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
